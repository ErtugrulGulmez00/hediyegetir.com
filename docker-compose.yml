# Yalnızca yerel geliştirme için. Yayında Neon kullanılır.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hediye
      POSTGRES_PASSWORD: hediye
      POSTGRES_DB: hediyegetir
    ports:
      - "5433:5432"
    volumes:
      - hediyegetir-db:/var/lib/postgresql/data

volumes:
  hediyegetir-db:
